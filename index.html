<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Armarium Vitae</title>
  <meta name="description" content="Manuscripts, histories, and the stories that form character. Kept whole against the drift.">
  <meta property="og:title" content="Armarium Vitae">
  <meta property="og:description" content="Manuscripts, histories, and the stories that form character. Kept whole against the drift.">
  <meta property="og:image" content="https://armariumvitae.com/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #faf9f6;
      --text-primary: #1a1a18;
      --text-secondary: #5a5a54;
      --text-tertiary: #9a9a92;
      --heading: #18180f;
      --border: rgba(0,0,0,0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141412;
        --text-primary: #f0ede6;
        --text-secondary: #a8a49c;
        --text-tertiary: #6a6660;
        --heading: #f0ede6;
        --border: rgba(255,255,255,0.12);
      }
    }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'EB Garamond', Georgia, serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4rem 2rem;
      max-width: 640px;
      width: 100%;
    }

    .ornament {
      width: 48px;
      height: 1px;
      background: var(--text-tertiary);
      margin-bottom: 2.5rem;
      opacity: 0.5;
    }

    .label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      text-align: center;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      font-weight: 500;
      text-align: center;
      line-height: 1.12;
      letter-spacing: -0.01em;
      color: var(--heading);
    }

    h1 em { font-style: italic; }

    .rule {
      width: 1px;
      height: 48px;
      background: var(--text-tertiary);
      margin: 2rem auto;
      opacity: 0.3;
    }

    .tagline {
      font-size: clamp(1.1rem, 2.5vw, 1.35rem);
      text-align: center;
      color: var(--text-primary);
      line-height: 1.7;
      margin-bottom: 0.6rem;
    }

    .tagline:last-of-type {
      margin-bottom: 3.5rem;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 100%;
      max-width: 340px;
      margin-bottom: 3rem;
    }

    .divider-line {
      flex: 1;
      height: 0.5px;
      background: var(--border);
    }

    .divider-glyph {
      font-size: 14px;
      color: var(--text-tertiary);
    }

    nav {
      display: flex;
      gap: 2.5rem;
      margin-bottom: 3rem;
    }

    nav a {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      text-decoration: none;
      border-bottom: 0.5px solid transparent;
      padding-bottom: 1px;
      transition: color 0.2s, border-color 0.2s;
    }

    nav a:hover {
      color: var(--text-primary);
      border-color: var(--border);
    }

    .contact {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--text-tertiary);
      text-align: center;
      margin-bottom: 2rem;
    }

    .contact a {
      color: var(--text-secondary);
      text-decoration: none;
      border-bottom: 0.5px solid var(--border);
      padding-bottom: 1px;
      transition: color 0.2s;
    }

    .contact a:hover { color: var(--text-primary); }

    footer {
      margin-top: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      text-align: center;
      opacity: 0.55;
      line-height: 2;
    }
  </style>
</head>
<body>
  <main>
    <div class="ornament"></div>
    <p class="label">Armarium Vitae</p>
    <h1>Armarium Vitae</h1>
    <div class="rule"></div>
    <p class="tagline">Manuscripts, histories, and the stories that form character.</p>
    <p class="tagline">Kept whole against the drift.</p>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-glyph">✦</span>
      <div class="divider-line"></div>
    </div>

    <nav>
      <a href="essays/">Essays</a>
    </nav>

    <p class="contact"><a href="mailto:elizabeth@armariumvitae.com">elizabeth@armariumvitae.com</a></p>

    <footer>
      Est. MMXXVI &nbsp;&middot;&nbsp; Dallas, Texas<br>
      &copy; Elizabeth Burdine 2026
    </footer>
  </main>
</body>
</html>
